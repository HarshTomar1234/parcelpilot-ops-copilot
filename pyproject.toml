[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parcelpilot-ops-copilot"
version = "0.1.0"
description = "Internal support/operations copilot for ParcelPilot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
    "opentelemetry-api>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
]
llm = [
    "anthropic>=0.40",
]
evaluation = [
    "deepeval>=2.0",
    "mlflow>=2.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/pricing.json", "agent/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "scripts/ingest_sources.py", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
